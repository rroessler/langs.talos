name: Deploy Docs
on: [workflow_dispatch, workflow_call]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2

            - name: Install Dependencies
              run: |
                  bun install
                  bun run build:syntax

            - name: Setup Pages
              id: setup_pages
              uses: actions/configure-pages@v5

            - name: Restore Cache
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/source/website/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
                  restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

            - name: Build Website
              run: bun website bundle
              env:
                  PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

            - name: Upload Artifacts
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ github.workspace }}/source/website/out

    deploy-pages:
        runs-on: ubuntu-latest
        needs: [deploy-build]
        continue-on-error: true
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    deploy-vscode:
        name: Publish VSC Extension
        needs: [deploy-build]
        uses: ./.github/workflows/vscode.yml
